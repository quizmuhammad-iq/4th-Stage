<head>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('sys_token');
    
    const hash = s => s.split('').reduce((a,b) => (((a << 5) - a) + b.charCodeAt(0))|0, 0);

    if (token && hash(token) === 2055055923) {
        localStorage.setItem('_sys_cfg_88', 'true');
    }

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isBypassed = localStorage.getItem('_sys_cfg_88') === 'true';
    
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!isIOS && !isBypassed) {
        document.documentElement.innerHTML = `
            <body style='background-color:#0D1B2E; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center; padding:20px; font-family:sans-serif;'>
                <div style='font-size:5rem; margin-bottom:20px;'>🚫</div>
                <h1 style='color:#F44336; font-size:2rem; font-weight:bold;'>الموقع مخصص لأجهزة الآيفون فقط</h1>
                <p style='color:#8899AA; font-size:1.2rem; margin-top:15px;'>لا يمكن الوصول للموقع من هذا الجهاز. يرجى استخدام جهاز آيفون أو تحميل البرنامج الخاص بنظام الاندرويد.</p>
            </body>
        `;
        window.stop();
    }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0D1B2E;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        .card { background-color: #152238; border: 1px solid #2A3F58; }
        .input-field { background-color: #152238; border: 1px solid #2A3F58; color: white; }
        .input-field:focus { outline: none; border-color: #C9A84C; }

</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6" oncontextmenu="return false;">
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <div class="w-full max-w-md flex flex-col gap-5 items-center">
        <div class="text-5xl mb-2">🔒</div>
        <h1 class="text-2xl font-bold text-center mb-4">تفعيل التطبيق</h1>

        <div class="card rounded-2xl p-5 w-full text-center">
            <p class="text-[#AABBCC] text-sm leading-relaxed mb-4">
                اشتري كود التفعيل لكي تحصل على الصلاحيات الكاملة<br><br>
                سعر كود التفعيل 3000 دينار تدفع لمرة واحدة<br><br>
                قم بمراسلة المطور لشراء كود التفعيل
            </p>
            <a href="https://t.me/f_8e5" target="_blank" class="w-full bg-[#29B6F6] text-white font-bold py-3 rounded-xl flex justify-center items-center">
                مراسلة المطور
            </a>
        </div>

        <input type="text" id="activation-code" placeholder="أدخل كود التفعيل هنا" class="input-field w-full rounded-xl p-4 text-center font-bold text-lg uppercase mt-4">

        <p id="error-msg" class="text-red-500 text-sm text-center hidden"></p>

        <button id="btnActivate" onclick="activateAccount()" class="w-full bg-[#C9A84C] text-[#0D1B2E] font-bold rounded-xl p-4">
            تفعيل التطبيق
        </button>

        <button onclick="goToMain()" class="text-[#8899AA] text-sm mt-4">
            تخطي والمتابعة بالنسخة المجانية ❯
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUserUid = null;

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                currentUserUid = user.uid;
            }
        });

        function showError(msg) {
            const errorP = document.getElementById('error-msg');
            errorP.innerText = msg;
            errorP.classList.remove('hidden');
        }

        function activateAccount() {
            const codeInput = document.getElementById('activation-code').value.trim().toUpperCase();
            if (!codeInput) return showError("أدخل الكود أولاً");
            if (!currentUserUid) return showError("يجب تسجيل الدخول أولاً");

            const btn = document.getElementById('btnActivate');
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            const codeRef = db.ref('activation_codes/' + codeInput);
            codeRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const codeData = snapshot.val();
                    if (codeData.used === false) {
                        let updates = {};
                        updates['activation_codes/' + codeInput + '/used'] = true;
                        updates['activation_codes/' + codeInput + '/usedBy'] = currentUserUid;
                        updates['students/' + currentUserUid + '/isPaid'] = true;

                        db.ref().update(updates).then(() => {
                            localStorage.setItem('isPaid', 'true');
                            alert("✅ مبارك، تم التفعيل بنجاح!");
                            window.location.href = "main.html";
                        }).catch((error) => {
                            btn.innerText = "تفعيل التطبيق";
                            btn.disabled = false;
                            showError("فشل التفعيل: " + error.message);
                        });
                    } else {
                        btn.innerText = "تفعيل التطبيق";
                        btn.disabled = false;
                        showError("هذا الكود مستخدم مسبقاً.");
                    }
                } else {
                    btn.innerText = "تفعيل التطبيق";
                    btn.disabled = false;
                    showError("كود التفعيل غير صحيح.");
                }
            }).catch((error) => {
                btn.innerText = "تفعيل التطبيق";
                btn.disabled = false;
                showError("خطأ في الاتصال: " + error.message);
            });
        }

        function goToMain() {
            window.location.href = "main.html";
        }
    </script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
</body>
</html>
