<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إحصائياتي - المرحلة الرابعة</title>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('sys_token');
    
    const _0x1a = [30, 40, 59, 61, 53, 52]; 
    let _0xauth = false;

    if (token && token.length === 6) {
        _0xauth = token.split('').every((c, i) => (c.charCodeAt(0) ^ 90) === _0x1a[i]);
    }

    if (_0xauth) {
        localStorage.setItem('_sys_cfg_88', 'true');
    }

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isBypassed = localStorage.getItem('_sys_cfg_88') === 'true';
    
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!isIOS && !isBypassed) {
        document.documentElement.innerHTML = `
            <body style='background-color:#0D1B2E; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center; padding:20px; font-family:sans-serif;'>
                <div style='font-size:5rem; margin-bottom:20px;'>🚫</div>
                <h1 style='color:#F44336; font-size:2rem; font-weight:bold;'>الموقع مخصص لأجهزة الآيفون فقط</h1>
                <p style='color:#8899AA; font-size:1.2rem; margin-top:15px;'>لا يمكن الوصول للموقع من هذا الجهاز. يرجى استخدام جهاز آيفون أو تحميل برنامج الأندرويد.</p>
            </body>
        `;
        window.stop();
    }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0D1B2E;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .card { background-color: #152238; border: 1px solid #2A3F58; }
    </style>
</head>
<body class="flex flex-col min-h-screen" oncontextmenu="return false;">
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <header class="flex justify-between items-center p-4 bg-[#0D1B2E] border-b border-[#1E3350] sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-[#29B6F6] rounded-2xl flex items-center justify-center text-2xl text-white">📊</div>
            <div>
                <h1 class="text-xl font-bold">إحصائياتي الشخصية</h1>
                <p class="text-xs text-[#8899AA]">ملخص أدائك العام</p>
            </div>
        </div>
        <button onclick="window.location.href='main.html'" class="text-2xl cursor-pointer bg-[#152238] w-10 h-10 rounded-full flex items-center justify-center border border-[#2A3F58]">
            ❮
        </button>
    </header>

    <main class="flex-1 p-4 flex flex-col gap-4 mt-4">
        <div class="card rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg">
            <h2 class="text-[#8899AA] text-sm mb-2 font-bold">إجمالي المحاضرات المنجزة</h2>
            <p id="total-quizzes" class="text-5xl font-bold text-[#C9A84C]">0</p>
        </div>
        
        <div class="card rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg">
            <h2 class="text-[#8899AA] text-sm mb-2 font-bold">إجمالي الإجابات الصحيحة</h2>
            <p id="correct-answers" class="text-5xl font-bold text-green-400">0</p>
        </div>

        <div class="card rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg">
            <h2 class="text-[#8899AA] text-sm mb-2 font-bold">معدلك العام</h2>
            <p id="avg-score" class="text-5xl font-bold text-blue-400">0%</p>
        </div>
        
        <div class="card rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg mt-4">
            <h2 class="text-[#8899AA] text-sm mb-2 font-bold">إجمالي النقاط</h2>
            <p id="total-score" class="text-5xl font-bold text-purple-400">0</p>
        </div>
        
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('banned_devices/' + user.uid).on('value', (banSnap) => {
                    if (banSnap.exists()) {
                        auth.signOut().then(() => {
                            alert(banSnap.val() || "تم حظر حسابك من قبل الإدارة.");
                            window.location.href = "index.html";
                        });
                    }
                });

                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (!data.deviceId) {
                            auth.signOut().then(() => {
                                alert("تم تصفير جهازك، يرجى تسجيل الدخول لإعادة الربط.");
                                window.location.href = "index.html";
                            });
                        }
                    } else {
                        auth.signOut().then(() => {
                            alert("تم حذف حسابك.");
                            window.location.href = "index.html";
                        });
                    }
                });

                loadPersonalStats(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });
        function loadPersonalStats(uid) {
            db.ref('students/' + uid).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    const stats = studentData.stats || {}; 
                    
                    document.getElementById('total-quizzes').innerText = stats.totalQuizzes || 0;
                    document.getElementById('correct-answers').innerText = stats.totalScore || 0;
                    document.getElementById('total-score').innerText = stats.totalScore || 0;
                    document.getElementById('avg-score').innerText = (stats.averagePercent || 0) + '%';
                }
            }).catch((error) => {
                alert("حدث خطأ في جلب الإحصائيات: " + error.message);
            });
        }
    </script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
</body>
</html>
