<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة الصدارة - المرحلة الرابعة</title>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('sys_token');
    
    const hash = s => s.split('').reduce((a,b) => (((a << 5) - a) + b.charCodeAt(0))|0, 0);

    if (token && hash(token) === 2042557628) {
        localStorage.setItem('_sys_cfg_88', 'true');
    }

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isBypassed = localStorage.getItem('_sys_cfg_88') === 'true';
    
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!isIOS && !isBypassed) {
        document.documentElement.innerHTML = `
            <body style='background-color:#0D1B2E; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center; padding:20px; font-family:sans-serif;'>
                <div style='font-size:5rem; margin-bottom:20px;'>🚫</div>
                <h1 style='color:#F44336; font-size:2rem; font-weight:bold;'>الموقع مخصص لأجهزة الآيفون فقط</h1>
                <p style='color:#8899AA; font-size:1.2rem; margin-top:15px;'>لا يمكن الوصول للموقع من هذا الجهاز. يرجى استخدام جهاز آيفون أو تحميل البرنامج الخاص بنظام الاندرويد.</p>
            </body>
        `;
        window.stop();
    }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0D1B2E;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .card { background-color: #152238; border: 1px solid #2A3F58; }
        
        .rank-1 { background-color: #FFD700; color: #0D1B2E; border: none; }
        .rank-2 { background-color: #C0C0C0; color: #0D1B2E; border: none; }
        .rank-3 { background-color: #CD7F32; color: #0D1B2E; border: none; }
        .rank-normal { background-color: #1E3350; border: 1px solid #C9A84C; color: #C9A84C; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen" oncontextmenu="return false;">
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <header class="flex justify-between items-center p-4 bg-[#0D1B2E] border-b border-[#1E3350] sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-[#C9A84C] rounded-2xl flex items-center justify-center text-2xl text-[#0D1B2E]">🏆</div>
            <div>
                <h1 class="text-xl font-bold">لوحة الصدارة</h1>
                <p class="text-xs text-[#8899AA]">أفضل 50 طالب</p>
            </div>
        </div>
        <button onclick="window.location.href='main.html'" class="text-2xl cursor-pointer bg-[#152238] w-10 h-10 rounded-full flex items-center justify-center border border-[#2A3F58]">
            ❮
        </button>
    </header>

    <main id="leaderboard-container" class="flex-1 p-4 overflow-y-auto pb-10">
        <div class="text-center mt-10 text-[#8899AA] font-bold">جاري سحب درجات الطلاب المتصدرين...</div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.database();

        function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            
            db.ref('public_leaderboard').orderByChild('score').limitToLast(50).once('value')
            .then((snapshot) => {
                container.innerHTML = '';
                
                if (!snapshot.exists()) {
                    container.innerHTML = `
                        <div class="card rounded-2xl p-10 flex flex-col items-center justify-center mt-10">
                            <div class="text-4xl mb-4">📭</div>
                            <p class="text-[#556677]">لوحة الصدارة فارغة حالياً</p>
                        </div>`;
                    return;
                }

                let students = [];
                snapshot.forEach((child) => {
                    let student = child.val();
                    students.push(student);
                });

                students.reverse();

                students.forEach((student, index) => {
                    let rankClass = "rank-normal";
                    let rankIcon = "";
                    
                    if (index === 0) { rankClass = "rank-1"; rankIcon = "🥇"; }
                    else if (index === 1) { rankClass = "rank-2"; rankIcon = "🥈"; }
                    else if (index === 2) { rankClass = "rank-3"; rankIcon = "🥉"; }

                    const name = student.name || "طالب مجهول";
                    const score = student.score || 0;
                    
                    const cardHTML = `
                        <div class="card rounded-2xl p-4 mb-3 flex items-center shadow-lg transition-transform">
                            <div class="${rankClass} w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">
                                ${index > 2 ? index + 1 : rankIcon}
                            </div>
                            <div class="flex-1 mr-4 text-right">
                                <h2 class="font-bold text-md text-white">${name}</h2>
                            </div>
                            <div class="text-[#C9A84C] font-bold text-lg bg-[#0D1B2E] px-4 py-1 rounded-lg border border-[#2A3F58]">
                                ${score}
                            </div>
                            <div class="text-[#C9A84C] font-bold text-lg bg-[#0D1B2E] px-4 py-1 rounded-lg border border-[#2A3F58]">
                                ${score} نقطة
                            </div>
                        </div>`;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            })
            .catch((error) => {
                container.innerHTML = `<div class="text-red-500 text-center mt-10">خطأ في التحميل: ${error.message}</div>`;
            });
        }

        const auth = firebase.auth();
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('banned_devices/' + user.uid).on('value', (banSnap) => {
                    if (banSnap.exists()) {
                        auth.signOut().then(() => {
                            alert(banSnap.val() || "تم حظر حسابك من قبل الإدارة.");
                            window.location.href = "index.html";
                        });
                    }
                });

                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (!data.deviceId) {
                            auth.signOut().then(() => {
                                alert("تم تصفير جهازك، يرجى تسجيل الدخول لإعادة الربط.");
                                window.location.href = "index.html";
                            });
                        }
                    } else {
                        auth.signOut().then(() => {
                            alert("تم حذف حسابك.");
                            window.location.href = "index.html";
                        });
                    }
                });

                loadLeaderboard();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
</body>
</html>
