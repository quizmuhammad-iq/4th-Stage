<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاختبار - المرحلة الرابعة</title>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('sys_token');
    
    const hash = s => s.split('').reduce((a,b) => (((a << 5) - a) + b.charCodeAt(0))|0, 0);

    if (token && hash(token) === 2055055923) {
        localStorage.setItem('_sys_cfg_88', 'true');
    }

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isBypassed = localStorage.getItem('_sys_cfg_88') === 'true';
    
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!isIOS && !isBypassed) {
        document.documentElement.innerHTML = `
            <body style='background-color:#0D1B2E; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center; padding:20px; font-family:sans-serif;'>
                <div style='font-size:5rem; margin-bottom:20px;'>🚫</div>
                <h1 style='color:#F44336; font-size:2rem; font-weight:bold;'>الموقع مخصص لأجهزة الآيفون فقط</h1>
                <p style='color:#8899AA; font-size:1.2rem; margin-top:15px;'>لا يمكن الوصول للموقع من هذا الجهاز. يرجى استخدام جهاز آيفون أو تحميل البرنامج الخاص بنظام الاندرويد.</p>
            </body>
        `;
        window.stop();
    }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0D1B2E;
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        #timer-banner {
            background-color: #F44336;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 50;
            position: relative;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 52px); 
            border: none;
            background-color: white;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <div id="timer-banner" class="hidden">جاري تحميل الوقت...</div>
    <iframe id="quiz-frame" src=""></iframe>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        let timerInterval;
        let scoreSubmitted = false;

        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('banned_devices/' + user.uid).on('value', (banSnap) => {
                    if (banSnap.exists()) {
                        auth.signOut().then(() => {
                            alert(banSnap.val() || "تم حظر حسابك من قبل الإدارة.");
                            window.location.href = "index.html";
                        });
                    }
                });

                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (!data.deviceId) {
                            auth.signOut().then(() => {
                                alert("تم تصفير جهازك، يرجى تسجيل الدخول لإعادة الربط.");
                                window.location.href = "index.html";
                            });
                        }
                    } else {
                        auth.signOut().then(() => {
                            alert("تم حذف حسابك.");
                            window.location.href = "index.html";
                        });
                    }
                });

                if (quizId) {
                    loadQuizData(quizId);
                } else {
                    alert("لم يتم تحديد كوز!");
                    window.location.href = "main.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });
        function loadQuizData(id) {
            const uid = auth.currentUser.uid;

            db.ref('students/' + uid).once('value').then((studentSnap) => {
                const studentData = studentSnap.val() || {};
                const isPaid = studentData.isPaid === true;

                db.ref('quizzes/' + id).once('value').then((quizSnap) => {
                    if (quizSnap.exists()) {
                        let quiz = quizSnap.val();
                        
                        if (!quiz.free && !isPaid) {
                            alert("⛔ محتوى مقفول! لا يمكنك الوصول لهذا الاختبار عبر الرابط المباشر.");
                            window.location.href = "payment.html";
                            return; 
                        }

                        document.title = quiz.title || 'اختبار';
                        document.getElementById('quiz-frame').src = quiz.fileUrl;
                        
                        if (quiz.duration && quiz.duration > 0) {
                            startTimer(quiz.duration);
                        }
                    } else {
                        alert("هذا الاختبار غير موجود أو تم حذفه.");
                        window.location.href = "main.html";
                    }
                });
            });
        }

        function startTimer(minutes) {
            const banner = document.getElementById('timer-banner');
            banner.classList.remove('hidden');
            let timeRemaining = minutes * 60; 

            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    banner.innerText = "انتهى الوقت!";
                    forceSubmit();
                } else {
                    let m = Math.floor(timeRemaining / 60);
                    let s = timeRemaining % 60;
                    banner.innerText = `الوقت المتبقي: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    timeRemaining--;
                }
            }, 1000);
        }

        function forceSubmit() {
            if (scoreSubmitted) return;
            scoreSubmitted = true;
            alert("انتهى الوقت! تم سحب الدفتر وإغلاق الاختبار.");
            window.location.href = "main.html";
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'QUIZ_FINISHED') {
                const score = event.data.score; 
                const correctCount = event.data.correctAnswers || 0; 
                const mistakes = event.data.mistakes || []; 
                
                if(timerInterval) clearInterval(timerInterval);
                
                saveResultToFirebase(score, correctCount, mistakes);
            }
        });

        function saveResultToFirebase(scorePercent, correctCount) {
    const uid = auth.currentUser.uid;
    const banner = document.getElementById('timer-banner');
    banner.classList.remove('hidden');
    banner.innerText = "جاري رفع النتيجة..."; 
    banner.style.backgroundColor = "#4CAF50";
            const urlParams = new URLSearchParams(window.location.search);
            const quizId = urlParams.get('id');
            const totalQs = scorePercent > 0 ? Math.round((correctCount * 100) / scorePercent) : (correctCount || 1);

            db.ref('results/' + quizId + '/' + uid).once('value').then((resSnap) => {
                let oldQuizScore = 0;
                let oldQuizTotal = 0;
                let isNewQuiz = true;

                if (resSnap.exists()) {
                    isNewQuiz = false;
                    let pastResult = resSnap.val();
                    oldQuizScore = pastResult.score || 0;
                    oldQuizTotal = pastResult.total || 0;

                    if (correctCount <= oldQuizScore) {
                        db.ref('students/' + uid).once('value').then(snap => {
                            if(snap.exists() && snap.val().stats){
                                let avg = snap.val().stats.averagePercent || 0;
                                let stuName = snap.val().name || "طالب مجهول";
                                db.ref('public_leaderboard/' + uid).update({
                                    name: stuName,
                                    score: avg,
                                    lastSubmitTime: Date.now()
                                });
                            }
                        });
                        alert("✅ تم الرفع! لم تكسب نقاط جديدة لأن درجتك السابقة أعلى أو مساوية.");
                        window.location.href = "main.html";
                        return; 
                    }
                }

                db.ref('students/' + uid).once('value').then((studentSnap) => {
                    let data = studentSnap.val() || {};
                    let stats = data.stats || { totalQuizzes: 0, totalScore: 0, totalQuestions: 0, averagePercent: 0 };
                    
                    let qCount = stats.totalQuizzes || 0;
                    let sScore = stats.totalScore || 0;
                    let sTotal = stats.totalQuestions || 0;

                    if (isNewQuiz) {
                        qCount += 1;
                        sScore += correctCount;
                        sTotal += totalQs;
                    } else {
                        sScore = sScore - oldQuizScore + correctCount;
                        sTotal = sTotal - oldQuizTotal + totalQs;
                    }

                    let newAvg = sTotal > 0 ? Math.round((sScore * 100) / sTotal) : 0;

                    let updates = {};
                    
                    updates['students/' + uid + '/stats/totalQuizzes'] = qCount;
                    updates['students/' + uid + '/stats/totalScore'] = sScore;
                    updates['students/' + uid + '/stats/totalQuestions'] = sTotal;
                    updates['students/' + uid + '/stats/averagePercent'] = newAvg;
                    updates['students/' + uid + '/stats/lastSubmitTime'] = Date.now();

                    let resultData = {
                        studentName: data.name || "طالب مجهول",
                        uid: uid,
                        subject: document.title || "اختبار",
                        quizId: quizId,
                        score: correctCount,
                        total: totalQs,
                        percentage: scorePercent,
                        submittedAt: Date.now()
                    };
                    
                    updates['results/' + quizId + '/' + uid] = resultData;
                    updates['leaderboard/' + quizId + '/' + uid] = resultData;

                    updates['public_leaderboard/' + uid + '/score'] = newAvg;
                    updates['public_leaderboard/' + uid + '/name'] = data.name || "طالب مجهول";
                    updates['public_leaderboard/' + uid + '/lastSubmitTime'] = Date.now();

                    db.ref().update(updates).then(() => {
                        let msg = isNewQuiz ? `✅ تم الرفع! معدلك العام أصبح ${newAvg}%` : `✅ تم كسر رقمك القياسي! معدلك ارتفع إلى ${newAvg}%`;
                        alert(msg);
                        window.location.href = "main.html";
                    }).catch((error) => {
                        alert("❌ فشل الرفع: " + error.message);
                    });
                });
            });
        }
    </script>

        <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            
            if (after - before > 1500) {
                document.body.innerHTML = `
                    <div style='background-color:#0D1B2E; position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:99999;'>
                        <div style='font-size:5rem; margin-bottom:20px;'>⛔</div>
                        <h1 style='color:#F44336; text-align:center; font-size:2rem; font-weight:bold; padding:20px; line-height: 1.5;'>
                            محاولة غش أو فحص مكتشفة!<br>الرجاء إغلاق أدوات المطور وتحديث الصفحة.
                        </h1>
                    </div>
                `;
            }
        }, 1000);
        </script>
</body>
</html>
