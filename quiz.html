<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاختبار - المرحلة الرابعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0D1B2E;
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        #timer-banner {
            background-color: #F44336;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 50;
            position: relative;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 52px); 
            border: none;
            background-color: white;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- جدار الحماية ضد تعطيل الجافا سكريبت -->
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <div id="timer-banner" class="hidden">جاري تحميل الوقت...</div>
    <iframe id="quiz-frame" src=""></iframe>

    <script>
        // ⚠️ مفاتيح الفايربيس
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        let timerInterval;
        let scoreSubmitted = false;

        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "index.html";
            } else if (quizId) {
                loadQuizData(quizId);
            } else {
                alert("لم يتم تحديد كوز!");
                window.location.href = "main.html";
            }
        });

        function loadQuizData(id) {
            const uid = auth.currentUser.uid;

            db.ref('students/' + uid).once('value').then((studentSnap) => {
                const studentData = studentSnap.val() || {};
                const isPaid = studentData.isPaid === true;

                db.ref('quizzes/' + id).once('value').then((quizSnap) => {
                    if (quizSnap.exists()) {
                        let quiz = quizSnap.val();
                        
                        if (!quiz.free && !isPaid) {
                            alert("⛔ محتوى مقفول! لا يمكنك الوصول لهذا الاختبار عبر الرابط المباشر.");
                            window.location.href = "payment.html";
                            return; 
                        }

                        document.title = quiz.title || 'اختبار';
                        document.getElementById('quiz-frame').src = quiz.fileUrl;
                        
                        if (quiz.duration && quiz.duration > 0) {
                            startTimer(quiz.duration);
                        }
                    } else {
                        alert("هذا الاختبار غير موجود أو تم حذفه.");
                        window.location.href = "main.html";
                    }
                });
            });
        }

        function startTimer(minutes) {
            const banner = document.getElementById('timer-banner');
            banner.classList.remove('hidden');
            let timeRemaining = minutes * 60; 

            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    banner.innerText = "انتهى الوقت!";
                    forceSubmit();
                } else {
                    let m = Math.floor(timeRemaining / 60);
                    let s = timeRemaining % 60;
                    banner.innerText = `الوقت المتبقي: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    timeRemaining--;
                }
            }, 1000);
        }

        function forceSubmit() {
            if (scoreSubmitted) return;
            scoreSubmitted = true;
            alert("انتهى الوقت! تم سحب الدفتر وإغلاق الاختبار.");
            window.location.href = "main.html";
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'QUIZ_FINISHED') {
                const score = event.data.score; 
                const correctCount = event.data.correctAnswers || 0; 
                const mistakes = event.data.mistakes || []; 
                
                if(timerInterval) clearInterval(timerInterval);
                
                saveResultToFirebase(score, correctCount, mistakes);
            }
        });

        function saveResultToFirebase(score, correctCount, mistakes) {
            const uid = auth.currentUser.uid;
            const banner = document.getElementById('timer-banner');
            banner.classList.remove('hidden');
            banner.innerText = "جاري الرفع وحفظ الأخطاء...";
            banner.style.backgroundColor = "#4CAF50"; 

            db.ref('students/' + uid).once('value').then((snapshot) => {
                let data = snapshot.val() || {};
                let oldQuizzes = data.completedQuizzes || 0;
                let oldCorrect = data.totalCorrectAnswers || 0;
                let oldAvg = data.averageScore || 0;

                let newQuizzes = oldQuizzes + 1;
                let newCorrect = oldCorrect + correctCount;
                let newAvg = Math.round(((oldAvg * oldQuizzes) + score) / newQuizzes);

                let updates = {};
                updates['students/' + uid + '/completedQuizzes'] = newQuizzes;
                updates['students/' + uid + '/totalCorrectAnswers'] = newCorrect;
                updates['students/' + uid + '/averageScore'] = newAvg;

                let oldTotalScore = data.totalScore || 0;
                let newTotalScore = oldTotalScore + score;
                updates['students/' + uid + '/totalScore'] = newTotalScore;
                updates['public_leaderboard/' + uid + '/score'] = newTotalScore;
                updates['public_leaderboard/' + uid + '/name'] = data.name || "طالب المرحلة الرابعة";

                // حفظ الأخطاء محلياً
                if (mistakes && mistakes.length > 0) {
                    let localMistakes = JSON.parse(localStorage.getItem('savedMistakes')) || [];
                    mistakes.forEach(mistake => {
                        localMistakes.push({
                            question: mistake.question,
                            studentAnswer: mistake.studentChoice,
                            correctAnswer: mistake.correctAnswer
                        });
                    });
                    localStorage.setItem('savedMistakes', JSON.stringify(localMistakes));
                }

                db.ref().update(updates).then(() => {
                    alert("✅ تم رفع النتيجة وحفظ الأخطاء محلياً!");
                    window.location.href = "main.html";
                }).catch((error) => {
                    alert("❌ فشل الرفع: " + error.message);
                });
            });
        }
    </script>

    <script>
        // 1. منع الكليك الأيمن واختصارات الكيبورد كلياً
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // منع F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // منع Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // منع Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 85) return false; // منع Ctrl+U
        };

        // 2. فخ أدوات المطور (Debugger Trap)
        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
</body>
</html>
