<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق المرحلة الرابعة</title>
    
    <!-- إعدادات تطبيق الويب (PWA) للأندرويد -->
    <link rel="manifest" href="manifest.json">
    <!-- إعدادات تطبيق الويب للايفون (iOS) -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="كوزات الرابعة">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0D1B2E;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        .card { background-color: #152238; border: 1px solid #2A3F58; }
        .num-badge { background-color: #1E3350; border: 1px solid #C9A84C; color: #C9A84C; }
        .term-active { background-color: #1E3350; border: 1px solid #C9A84C; color: #C9A84C; }
        .term-inactive { background-color: transparent; color: #556677; }
        .tab-active { border-bottom: 2px solid #C9A84C; color: #C9A84C; }
        .tab-inactive { color: #8899AA; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen" oncontextmenu="return false;">
    <!-- جدار الحماية ضد تعطيل الجافا سكريبت -->
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <!-- الهيدر -->
    <header class="flex justify-between items-center p-4 bg-[#0D1B2E] border-b border-[#1E3350]">
        <div class="flex items-center gap-3">
            <div id="header-icon" class="w-12 h-12 bg-blue-500 rounded-2xl flex items-center justify-center text-2xl">🧲</div>
            <div>
                <h1 id="header-title" class="text-xl font-bold">الرنين</h1>
                <p id="quiz-count" class="text-xs text-[#8899AA]">جاري التحميل...</p>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="showAbout()" class="text-sm font-bold text-[#C9A84C] bg-[#1E3350] px-3 py-1 rounded-lg border border-[#C9A84C]">حول</button>
            <button onclick="window.location.href='stats.html'" class="text-2xl cursor-pointer ml-1">📊</button>
            <button onclick="window.location.href='leaderboard.html'" class="text-2xl cursor-pointer ml-1">🏆</button>
            <div class="text-2xl cursor-pointer" onclick="logout()">🚪</div>
        </div>
    </header>

    <!-- أزرار تبديل الكورسات -->
    <div id="term-toggle-container" class="flex p-4 bg-[#0D1B2E]">
        <button id="btn-term-2" onclick="switchTerm(2)" class="flex-1 py-2 font-bold rounded-xl term-inactive transition-all">الكورس الثاني</button>
        <button id="btn-term-1" onclick="switchTerm(1)" class="flex-1 py-2 font-bold rounded-xl mr-2 term-active transition-all">الكورس الأول</button>
    </div>

    <!-- شريط التبويبات (المواد) -->
    <div id="tabs-container" class="flex overflow-x-auto bg-[#0D1B2E] border-b border-[#1E3350] p-2 whitespace-nowrap">
        <!-- يتم توليد المواد برمجياً هنا -->
    </div>

    <!-- حاوية المحتوى -->
    <main id="main-content" class="flex-1 p-4 overflow-y-auto pb-20">
        <div class="text-center mt-10 text-[#8899AA]">جاري تحميل البيانات...</div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        const termsData = {
            1: [
                { id: 'c1_ranin', name: 'رنين', icon: '🧲', color: 'bg-blue-500' },
                { id: 'c1_mafras', name: 'مفراس', icon: '🖥', color: 'bg-purple-500' },
                { id: 'c1_sonar', name: 'سونار', icon: '📟', color: 'bg-green-500' },
                { id: 'c1_ihsa', name: 'احصاء', icon: '📚', color: 'bg-yellow-500' },
                { id: 'c1_jaraha', name: 'جراحة', icon: '🩺', color: 'bg-pink-500' }
            ],
            2: [
                { id: 'c2_ranin', name: 'رنين', icon: '🧲', color: 'bg-blue-500' },
                { id: 'c2_mafras', name: 'مفراس', icon: '🖥', color: 'bg-purple-500' },
                { id: 'c2_sonar', name: 'سونار', icon: '📟', color: 'bg-green-500' },
                { id: 'c2_akhlaq', name: 'اخلاقيات', icon: '⚖️', color: 'bg-yellow-500' },
                { id: 'c2_jaraha', name: 'جراحة', icon: '🩺', color: 'bg-pink-500' }
            ]
        };

        let currentTerm = 1;

        let currentUserData = null; // متغير عالمي لحفظ بيانات الطالب (الاسم وحالة الدفع)

        auth.onAuthStateChanged((user) => {
            if (user) {
                // 1. مستمع الحظر
                db.ref('banned_devices/' + user.uid).on('value', (banSnap) => {
                    if (banSnap.exists()) {
                        auth.signOut().then(() => {
                            alert(banSnap.val() || "تم حظر حسابك من قبل الإدارة.");
                            window.location.href = "index.html";
                        });
                    }
                });

                // 2. مستمع التصفير وسحب بيانات الطالب
                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        currentUserData = snapshot.val(); // 👈 حفظنا البيانات هنا علمود قسم "حول"
                        if (!currentUserData.deviceId) {
                            auth.signOut().then(() => {
                                alert("تم تصفير جهازك، يرجى تسجيل الدخول لإعادة الربط.");
                                window.location.href = "index.html";
                            });
                        }
                    } else {
                        auth.signOut().then(() => {
                            alert("تم حذف حسابك.");
                            window.location.href = "index.html";
                        });
                    }
                });

                // 3. مستمع وضع الصيانة (يقفل الموقع فوراً إذا الأدمن فعله)
                db.ref('app_control/maintenance_mode').on('value', (snap) => {
                    if (snap.val() === true) {
                        // مسح محتوى الشاشة وعرض رسالة الصيانة
                        document.body.innerHTML = `
                            <div style="display:flex; height:100vh; background-color:#0D1B2E; color:white; align-items:center; justify-content:center; flex-direction:column; padding:20px; text-align:center;">
                                <span style="font-size:70px; margin-bottom:20px;">🛠</span>
                                <h1 style="font-size:28px; font-weight:bold; color:#C9A84C;">التطبيق تحت الصيانة</h1>
                                <p style="color:#8899AA; margin-top:15px; font-size:16px;">نعمل على تحديث المنصة وتحسينها.<br>يرجى العودة لاحقاً.</p>
                            </div>
                        `;
                    }
                });

                // تشغيل واجهة الكورسات (وظيفة الصفحة)
                switchTerm(1);
            } else {
                window.location.href = "index.html";
            }
        });

        function switchTerm(termNum) {
            currentTerm = termNum;
            document.getElementById('btn-term-1').className = `flex-1 py-2 font-bold rounded-xl mr-2 transition-all ${termNum === 1 ? 'term-active' : 'term-inactive'}`;
            document.getElementById('btn-term-2').className = `flex-1 py-2 font-bold rounded-xl transition-all ${termNum === 2 ? 'term-active' : 'term-inactive'}`;
            document.getElementById('term-toggle-container').style.display = 'flex';
            document.getElementById('tabs-container').style.display = 'flex';
            renderTabs();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            termsData[currentTerm].forEach((subject, index) => {
                const btn = document.createElement('button');
                btn.innerText = subject.name;
                btn.className = `px-4 py-2 font-bold mx-1 ${index === 0 ? 'tab-active' : 'tab-inactive'}`;
                btn.onclick = () => selectTab(index, btn);
                tabsContainer.appendChild(btn);
            });
            selectTab(0, tabsContainer.firstChild);
        }

        function selectTab(index, btnElement) {
            const allTabs = document.getElementById('tabs-container').children;
            for(let tab of allTabs) tab.className = 'px-4 py-2 font-bold mx-1 tab-inactive';
            btnElement.className = 'px-4 py-2 font-bold mx-1 tab-active';

            const subject = termsData[currentTerm][index];
            document.getElementById('header-title').innerText = subject.name;
            const iconDiv = document.getElementById('header-icon');
            iconDiv.innerText = subject.icon;
            iconDiv.className = `w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${subject.color}`;
            loadQuizzes(subject.id);
        }

        function loadQuizzes(categoryId) {
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="text-center mt-10 text-[#8899AA]">جاري تحميل المحاضرات...</div>';

            db.ref('quizzes').orderByChild('category').equalTo(categoryId).once('value', (snapshot) => {
                container.innerHTML = '';
                let quizzes = [];
                snapshot.forEach((child) => {
                    let quiz = child.val();
                    quiz.id = child.key;
                    if (quiz.active) quizzes.push(quiz);
                });

                document.getElementById('quiz-count').innerText = quizzes.length + ' محاضرة';

                if (quizzes.length === 0) {
                    container.innerHTML = `
                        <div class="card rounded-2xl p-10 flex flex-col items-center justify-center mt-10">
                            <div class="text-4xl mb-4">📂</div>
                            <p class="text-[#556677]">لا توجد محاضرات في هذا القسم</p>
                        </div>`;
                    return;
                }

                quizzes.reverse().forEach((quiz, index) => {
                    const title = quiz.quizDisplayTitle || quiz.title || quiz.fileName.replace('.html', '');
                    const freeTag = quiz.free ? '<span class="text-xs text-green-400"> | 🆓 مجاني</span>' : '';
                    
                    const cardHTML = `
                        <div onclick="openQuiz('${quiz.id}', ${quiz.free || false})" class="card rounded-2xl p-4 mb-3 flex items-center cursor-pointer active:scale-95 transition-transform">
                            <div class="num-badge w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm">${index + 1}</div>
                            <div class="flex-1 mr-4 text-right">
                                <h2 class="font-bold text-lg">${title}</h2>
                                <p class="text-xs text-[#C9A84C] mt-1">📖 ${quiz.date || ''} ${freeTag}</p>
                            </div>
                            <div class="text-[#556677] text-sm">❯</div>
                        </div>`;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            });
        }

        function showAbout() {
            document.getElementById('term-toggle-container').style.display = 'none';
            document.getElementById('tabs-container').style.display = 'none';
            document.getElementById('header-title').innerText = "حول التطبيق";
            document.getElementById('quiz-count').innerText = "الإصدار 6.0";
            const iconDiv = document.getElementById('header-icon');
            iconDiv.innerText = "ℹ";
            iconDiv.className = `w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-[#C9A84C] text-[#0D1B2E]`;

            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="card rounded-2xl p-6 flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-[#1E3350] border-2 border-[#C9A84C] rounded-full flex items-center justify-center text-4xl mb-4">🎓</div>
                    <h2 class="text-xl font-bold text-white mb-2">تطبيق اختبارات المرحلة الرابعة</h2>
                    <p class="text-[#C9A84C] text-sm mb-4">جامعة الهادي - قسم الأشعة</p>
                    <div class="w-full h-px bg-[#1E3350] mb-4"></div>
                    <p class="text-sm text-gray-300 leading-relaxed mb-6">يحتوي هذا التطبيق على مواد الكورس الأول والكورس الثاني لمساعدتك في اجتياز الامتحانات بنجاح.</p>
                    
                    <h3 class="text-[#8899AA] text-sm font-bold mb-4">Follow me on</h3>
                    <div class="flex gap-5 justify-center mb-4 w-full px-4">
                        <!-- Instagram -->
                        <a href="https://instagram.com/f_8e5" target="_blank" class="w-12 h-12 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-full flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform">📸</a>
                        <!-- Telegram Channel -->
                        <a href="https://t.me/mulimcq" target="_blank" class="w-12 h-12 bg-[#29B6F6] rounded-full flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform">📢</a>
                        <!-- Private Telegram -->
                        <a href="https://t.me/Khadera0" target="_blank" class="w-12 h-12 bg-[#1E3350] border border-[#29B6F6] text-[#29B6F6] rounded-full flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform">💬</a>
                    </div>
                </div>
            `;
        }

        function openQuiz(quizId, isFree) {
            const isPaid = localStorage.getItem('isPaid') === 'true';
            if (isFree || isPaid) {
                window.location.href = `quiz.html?id=${quizId}`;
            } else {
                window.location.href = "payment.html";
            }
        }

        function logout() {
            auth.signOut().then(() => {
                localStorage.clear();
                window.location.href = "index.html";
            });
        }
    </script>

    <script>
        // 1. منع الكليك الأيمن واختصارات الكيبورد كلياً
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        // 2. فخ أدوات المطور (Debugger Trap)
        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
    
    <script>
        // تسجيل الـ Service Worker لتفعيل التثبيت PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((error) => {
                    console.log('فشل تسجيل PWA:', error);
                });
            });
        }
    </script>
</body>
</html>
