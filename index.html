<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - المرحلة الرابعة</title>
    
    <!-- إعدادات تطبيق الويب (PWA) للأندرويد -->
    <link rel="manifest" href="manifest.json">
    <!-- إعدادات تطبيق الويب للايفون (iOS) -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="كوزات الرابعة">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { background-color: #0D1B2E; color: white; user-select: none; -webkit-touch-callout: none; }
        .input-field { background-color: #152238; border: 1px solid #2A3F58; color: white; }
        .input-field:focus { outline: none; border-color: #C9A84C; }
        .card { background-color: #1E3350; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6" oncontextmenu="return false;">
    <!-- جدار الحماية ضد تعطيل الجافا سكريبت -->
    <noscript>
        <style>
            body { display: none !important; }
        </style>
        <meta http-equiv="refresh" content="0; url=about:blank">
    </noscript>

    <div class="w-full max-w-md flex flex-col gap-4 items-center">
        <div class="w-24 h-24 bg-[#152238] rounded-3xl flex items-center justify-center border-2 border-[#C9A84C] shadow-lg mb-4">
            <span class="text-5xl">🎓</span>
        </div>
        
        <h1 id="form-title" class="text-2xl font-bold mb-2">تسجيل الدخول</h1>
        <p id="error-msg" class="text-red-500 text-sm text-center hidden w-full p-2 bg-red-500/20 rounded-lg"></p>

        <!-- حقول إنشاء الحساب (مخفية بالبداية) -->
        <input type="text" id="user-name" placeholder="الاسم الثلاثي" class="input-field w-full rounded-xl p-4 hidden">
        <input type="text" id="user-uni" placeholder="الجامعة أو الكلية (مثال: كلية الإسراء الجامعة)" class="input-field w-full rounded-xl p-4 hidden">
        
        <input type="email" id="user-email" placeholder="البريد الإلكتروني" class="input-field w-full rounded-xl p-4 text-left" dir="ltr">
        <input type="password" id="user-pass" placeholder="كلمة المرور (6 أحرف على الأقل)" class="input-field w-full rounded-xl p-4 text-left" dir="ltr">

        <button id="btn-submit" onclick="handleAuth()" class="w-full bg-[#C9A84C] text-[#0D1B2E] font-bold rounded-xl p-4 mt-2 hover:bg-yellow-500 transition">
            دخول
        </button>

        <button onclick="toggleMode()" id="btn-toggle" class="text-[#8899AA] text-sm mt-4 hover:text-white transition">
            ليس لديك حساب؟ أنشئ حساباً جديداً
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDogRarkXKNLUMZKRbq9cQBHxD1OZkj17A",
            authDomain: "ministquiz.firebaseapp.com",
            databaseURL: "https://ministquiz-default-rtdb.firebaseio.com",
            projectId: "ministquiz",
            storageBucket: "ministquiz.firebasestorage.app",
            messagingSenderId: "97927221272",
            appId: "1:97927221272:web:412147e2da692cb946f36d",
            measurementId: "G-7ZH4XECTE5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        let isSignUp = false;
        let isAuthProcessing = false; // 👈 المتغير المنقذ

        let localDeviceId = localStorage.getItem('web_device_id');
        if (!localDeviceId) {
            localDeviceId = 'web_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            localStorage.setItem('web_device_id', localDeviceId);
        }

        // الفحص التلقائي يشتغل فقط إذا الطالب مو جاي يسجل يدوياً بلحظتها
        auth.onAuthStateChanged((user) => {
            if (user && !isAuthProcessing) {
                checkUserStatus(user.uid);
            }
        });

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('error-msg').classList.add('hidden');
            const nameInput = document.getElementById('user-name');
            const title = document.getElementById('form-title');
            const btnSubmit = document.getElementById('btn-submit');
            const btnToggle = document.getElementById('btn-toggle');

            if (isSignUp) {
                nameInput.classList.remove('hidden');
                title.innerText = "إنشاء حساب جديد";
                btnSubmit.innerText = "إنشاء الحساب";
                btnToggle.innerText = "لديك حساب بالفعل؟ سجل دخولك";
            } else {
                nameInput.classList.add('hidden');
                title.innerText = "تسجيل الدخول";
                btnSubmit.innerText = "دخول";
                btnToggle.innerText = "ليس لديك حساب؟ أنشئ حساباً جديداً";
            }
        }

        function handleAuth() {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-pass').value.trim();
            const name = document.getElementById('user-name').value.trim();

            if (!email || !pass) return showError("يرجى ملء الحقول المطلوبة.");
            if (isSignUp && !name) return showError("يرجى كتابة اسمك الثلاثي.");

            document.getElementById('btn-submit').innerText = "جاري التحميل...";
            document.getElementById('btn-submit').disabled = true;
            
            isAuthProcessing = true; 

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    const uid = cred.user.uid;
                    const now = Date.now();
                    db.ref('students/' + uid).set({
                        name: name,
                        email: email,
                        isPaid: false,
                        deviceId: localDeviceId, 
                        platform: "web", 
                        lastDeviceReset: now,
                        registeredAt: now, 
                        // توحيد الإحصائيات بالضبط مثل الاندرويد
                        stats: {
                            totalQuizzes: 0,
                            totalScore: 0,
                            totalQuestions: 0,
                            averagePercent: 0,
                            lastSubmitTime: now
                        }
                    }).then(() => {
                        isAuthProcessing = false;
                        checkUserStatus(uid);
                    });
                }).catch((error) => {
                    isAuthProcessing = false; 
                    showError(translateError(error.code));
                });
            } else {
                auth.signInWithEmailAndPassword(email, pass).then((cred) => {
                    isAuthProcessing = false; 
                    checkUserStatus(cred.user.uid);
                }).catch((error) => {
                    isAuthProcessing = false;
                    showError(translateError(error.code));
                });
            }
        }
        function checkUserStatus(uid) {
            // الفحص الأول: نتأكد من جدول الحظر أولاً
            db.ref('banned_devices/' + uid).once('value').then((banSnap) => {
                if (banSnap.exists()) {
                    auth.signOut();
                    isAuthProcessing = false; // تحرير المتغير المنقذ
                    // نعرض رسالة الحظر اللي جايتك من الفايربيس
                    return showError(banSnap.val() || "تم حظر هذا الحساب ولا يمكنك استخدام التطبيق."); 
                }

                // الفحص الثاني: إذا مو محظور، نفحص جهازه بجدول الطلاب
                db.ref('students/' + uid).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        const now = Date.now();
                        const thirtyDaysInMs = 30 * 24 * 60 * 60 * 1000; 

                        if (!data.deviceId) {
                            db.ref('students/' + uid).update({ 
                                deviceId: localDeviceId, 
                                lastDeviceReset: now 
                            }).then(() => {
                                isAuthProcessing = false;
                                proceedToApp(data.isPaid);
                            });
                        } else if (data.deviceId !== localDeviceId) {
                            const lastReset = data.lastDeviceReset || 0;
                            const timeSinceReset = now - lastReset;

                            if (timeSinceReset > thirtyDaysInMs) {
                                const confirmReset = confirm("عذراً، هذا الحساب مربوط بمتصفح آخر أو قمت بمسح بيانات متصفحك.\n\nهل تريد ربط الحساب بهذا المتصفح؟\n(تنبيه: يمكنك القيام بهذا الإجراء مرة واحدة فقط كل 30 يوم).");
                                
                                if (confirmReset) {
                                    db.ref('students/' + uid).update({ 
                                        deviceId: localDeviceId, 
                                        lastDeviceReset: now 
                                    }).then(() => {
                                        isAuthProcessing = false;
                                        proceedToApp(data.isPaid);
                                    });
                                } else {
                                    auth.signOut();
                                    isAuthProcessing = false;
                                }
                            } else {
                                const daysLeft = Math.ceil((thirtyDaysInMs - timeSinceReset) / (1000 * 60 * 60 * 24));
                                auth.signOut();
                                isAuthProcessing = false;
                                return showError(`هذا الحساب مربوط بجهاز آخر. الرجاء الانتظار ${daysLeft} يوم.`);
                            }
                        } else {
                            isAuthProcessing = false;
                            proceedToApp(data.isPaid);
                        }
                    } else {
                        auth.signOut();
                        isAuthProcessing = false;
                        showError("بيانات الحساب غير موجودة في قاعدة البيانات.");
                    }
                }).catch((error) => {
                    isAuthProcessing = false;
                    showError(error.message);
                });
            }).catch((error) => {
                isAuthProcessing = false;
                showError(error.message);
            });
        }
        function proceedToApp(isPaid) {
            localStorage.setItem('isPaid', isPaid === true ? 'true' : 'false');
            window.location.href = isPaid ? "main.html" : "payment.html";
        }

        function translateError(code) {
            if (code === 'auth/email-already-in-use') return 'هذا البريد مستخدم مسبقاً.';
            if (code === 'auth/invalid-email') return 'صيغة البريد الإلكتروني غير صحيحة.';
            if (code === 'auth/weak-password') return 'كلمة المرور ضعيفة (يجب أن تكون 6 أحرف على الأقل).';
            if (code === 'auth/user-not-found' || code === 'auth/wrong-password') return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
            return code;
        }
    </script>

    <script>
        // 1. منع الكليك الأيمن واختصارات الكيبورد كلياً
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; 
            if(e.ctrlKey && e.keyCode == 85) return false; 
        };

        // 2. فخ أدوات المطور (Debugger Trap)
        setInterval(function() {
            let before = new Date().getTime();
            debugger; 
            let after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh; font-size:3rem; font-weight:bold;'>⛔ محاولة غش مكتشفة! الرجاء إغلاق أدوات المطور.</h1>";
                window.location.replace("about:blank");
            }
        }, 1000);
    </script>
    
    <script>
        // تسجيل الـ Service Worker لتفعيل التثبيت PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((error) => {
                    console.log('فشل تسجيل PWA:', error);
                });
            });
        }
    </script>
</body>
</html>
